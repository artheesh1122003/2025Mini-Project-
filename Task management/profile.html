<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | TaskFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">
    <div class="app-container">
        <!-- Sidebar (Same as index.html) -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-layer-group"></i>
                </div>
                <span>TaskFlow</span>
            </div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-tasks"></i>
                    <span>All Tasks</span>
                </a>
                <a href="index.html#today" class="nav-item">
                    <i class="far fa-calendar-check"></i>
                    <span>Today</span>
                </a>
                <a href="index.html#upcoming" class="nav-item">
                    <i class="far fa-calendar-alt"></i>
                    <span>Upcoming</span>
                </a>
                <a href="index.html#completed" class="nav-item">
                    <i class="fas fa-check-double"></i>
                    <span>Completed</span>
                </a>
            </nav>

            <div class="sidebar-divider"></div>
            <!-- Categories removed -->

            <div class="sidebar-footer">
                <a href="profile.html" class="user-profile-link active-link"
                    style="text-decoration: none; color: inherit;">
                    <div class="user-profile active">
                        <img src="https://ui-avatars.com/api/?name=Alex+Morgan&background=6366f1&color=fff" alt="User"
                            id="user-avatar">
                        <div class="user-info">
                            <span class="user-name">Artheesh</span>
                        </div>
                        <i class="fas fa-chevron-right"
                            style="margin-left: auto; font-size: 0.8rem; color: var(--text-main);"></i>
                    </div>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumb">
                    <a href="index.html">Dashboard</a>
                    <i class="fas fa-chevron-right"></i>
                    <span>My Profile</span>
                </div>
                <div class="system-clock">
                    <span id="clock-time">00:00:00</span>
                    <span id="clock-date">Month Day, Year</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn theme-toggle">
                        <i class="fas fa-moon"></i>
                    </button>

                </div>
            </header>

            <div class="profile-container">
                <!-- Profile Header -->
                <div class="profile-header-card glass">
                    <div class="profile-cover"></div>
                    <div class="profile-main-info">
                        <div class="profile-avatar-wrapper">
                            <img src="https://ui-avatars.com/api/?name=Alex+Morgan&background=6366f1&color=fff&size=128"
                                alt="Alex Morgan" class="large-avatar">
                            <button class="edit-avatar-btn"><i class="fas fa-camera"></i></button>
                        </div>
                        <div class="profile-text-info">
                            <h1>Artheesh</h1>
                        </div>
                        <div class="profile-actions">
                            <button class="btn-primary">Edit Profile</button>
                        </div>
                    </div>
                </div>

                <!-- Profile Grid -->
                <div class="profile-grid">
                    <!-- Personal Information -->
                    <div class="profile-card glass">
                        <div class="card-header">
                            <h3><i class="fas fa-user-circle"></i> Personal Information</h3>
                        </div>
                        <div class="card-body" id="personal-info-display">
                            <div class="info-item">
                                <label>Full Name</label>
                                <span id="display-name">Alex Morgan</span>
                            </div>
                            <div class="info-item">
                                <label>Email Address</label>
                                <span id="display-email">alex.morgan@example.com</span>
                            </div>
                            <div class="info-item">
                                <label>Location</label>
                                <span id="display-location">San Francisco, CA</span>
                            </div>
                            <div class="info-item">
                                <label>Timezone</label>
                                <span id="display-timezone">Pacific Time (PT)</span>
                            </div>
                        </div>
                    </div>

                    <!-- Only Personal Information remains -->

                </div>
            </div>
        </main>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2>Edit Personal Information</h2>
                <button class="close-profile-modal close-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="edit-profile-form">
                <div class="form-group">
                    <label for="edit-name">Full Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-email">Email Address</label>
                    <input type="email" id="edit-email" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-location">Location</label>
                        <input type="text" id="edit-location">
                    </div>
                    <div class="form-group">
                        <label for="edit-timezone">Timezone</label>
                        <select id="edit-timezone">
                            <option value="Pacific Time (PT)">Pacific Time (PT)</option>
                            <option value="Eastern Time (ET)">Eastern Time (ET)</option>
                            <option value="UTC">UTC</option>
                            <option value="GMT">GMT</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-ghost close-profile-modal">Cancel</button>
                    <button type="submit" class="btn-primary">Update Profile</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Profile Management Logic
        class ProfileManager {
            constructor() {
                this.userData = JSON.parse(localStorage.getItem('taskflow_user')) || {
                    name: 'Alex Morgan',
                    email: 'alex.morgan@example.com',
                    location: 'San Francisco, CA',
                    timezone: 'Pacific Time (PT)'
                };
                this.init();
            }

            init() {
                this.cacheDOM();
                this.bindEvents();
                this.updateDisplay();
                this.startClock();
            }

            startClock() {
                const update = () => {
                    const now = new Date();
                    const timeElement = document.getElementById('clock-time');
                    const dateElement = document.getElementById('clock-date');

                    if (timeElement) {
                        timeElement.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
                    }
                    if (dateElement) {
                        dateElement.innerText = now.toLocaleDateString([], {
                            weekday: 'short',
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });
                    }
                };
                update();
                setInterval(update, 1000);
            }

            cacheDOM() {
                this.modal = document.getElementById('edit-profile-modal');
                this.form = document.getElementById('edit-profile-form');
                this.editBtn = document.querySelector('.profile-actions .btn-primary');
                this.closeBtns = document.querySelectorAll('.close-profile-modal');

                // Display elements
                this.displayElems = {
                    name: document.getElementById('display-name'),
                    email: document.getElementById('display-email'),
                    location: document.getElementById('display-location'),
                    timezone: document.getElementById('display-timezone'),
                    headerName: document.querySelector('.profile-text-info h1'),
                    sidebarName: document.querySelector('.user-name')
                };
            }

            bindEvents() {
                this.editBtn.addEventListener('click', () => this.openModal());
                this.closeBtns.forEach(btn => btn.addEventListener('click', () => this.closeModal()));
                this.form.addEventListener('submit', (e) => this.handleUpdate(e));
            }

            updateDisplay() {
                this.displayElems.name.innerText = this.userData.name;
                this.displayElems.email.innerText = this.userData.email;
                this.displayElems.location.innerText = this.userData.location;
                this.displayElems.timezone.innerText = this.userData.timezone;
                this.displayElems.headerName.innerText = this.userData.name;
                this.displayElems.sidebarName.innerText = this.userData.name;

                // Update avatar names
                const names = this.userData.name.split(' ');
                const avatarUrl = `https://ui-avatars.com/api/?name=${names.join('+')}&background=6366f1&color=fff`;
                document.querySelectorAll('img[src*="ui-avatars"]').forEach(img => {
                    img.src = avatarUrl;
                });
            }

            openModal() {
                document.getElementById('edit-name').value = this.userData.name;
                document.getElementById('edit-email').value = this.userData.email;
                document.getElementById('edit-location').value = this.userData.location;
                document.getElementById('edit-timezone').value = this.userData.timezone;
                this.modal.classList.add('active');
            }

            closeModal() {
                this.modal.classList.remove('active');
            }

            handleUpdate(e) {
                e.preventDefault();
                this.userData = {
                    name: document.getElementById('edit-name').value,
                    email: document.getElementById('edit-email').value,
                    location: document.getElementById('edit-location').value,
                    timezone: document.getElementById('edit-timezone').value
                };
                localStorage.setItem('taskflow_user', JSON.stringify(this.userData));
                this.updateDisplay();
                this.closeModal();
                this.showToast('Profile updated successfully!');
            }



            showToast(msg) {
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    bottom: 2rem;
                    right: 2rem;
                    background: var(--success);
                    color: white;
                    padding: 1rem 2rem;
                    border-radius: 12px;
                    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                    z-index: 9999;
                    animation: slideIn 0.3s ease-out;
                `;
                toast.innerText = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        }

        const profileManager = new ProfileManager();
    </script>
</body>

</html>
