<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Calendar 2026-2050</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Future calendar</h1>
            <p>Explorer of Time: 2025 - 2050</p>
            <div id="liveClock" class="live-clock">00:00:00</div>
        </header>

        <main>
            <div class="calendar-controls">
                <button id="prevYear" class="control-btn" aria-label="Previous Year"><i
                        class="fa-solid fa-backward"></i></button>
                <button id="prevMonth" class="control-btn" aria-label="Previous Month"><i
                        class="fa-solid fa-chevron-left"></i></button>

                <div class="date-display">
                    <h2 id="currentMonth">January</h2>
                    <div class="year-selector-container">
                        <select id="yearSelect"></select>
                    </div>
                </div>

                <button id="goToTodayBtn" class="control-btn today-btn" aria-label="Go to Today"
                    title="Jump to Today"><i class="fa-solid fa-calendar-day"></i></button>

                <button id="nextMonth" class="control-btn" aria-label="Next Month"><i
                        class="fa-solid fa-chevron-right"></i></button>
                <button id="nextYear" class="control-btn" aria-label="Next Year"><i
                        class="fa-solid fa-forward"></i></button>
            </div>

            <!-- Search Section -->
            <div class="search-container">
                <div class="input-group">
                    <input type="date" id="dateSearchInput" min="2026-01-01" max="2050-12-31">
                    <button id="searchDateBtn">Go to Date</button>
                </div>
            </div>

            <div class="calendar-wrapper">
                <div class="weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div class="days" id="calendarDays">
                    <!-- Days will be generated by JS -->
                </div>
            </div>

            <div class="info-panel">
                <div class="info-card">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span id="selectedFullDate">Select a date</span>
                </div>

                <!-- Reminder Section -->
                <div class="reminder-section" id="reminderSection" style="display:none; margin-top: 1rem;">
                    <div class="input-group">
                        <input type="text" id="reminderInput" placeholder="Enter reminder description...">
                        <button id="setReminderBtn"><i class="fa-solid fa-bell"></i> Set</button>
                    </div>
                    <div id="activeReminderDisplay" class="active-reminder" style="display:none;">
                        <i class="fa-solid fa-bell-ring"></i>
                        <span id="reminderText"></span>
                        <button id="deleteReminderBtn" class="delete-btn"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <!-- Future Age Calculator -->
                <div class="age-calculator-section"
                    style="margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <h3
                        style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-user-astronaut"></i> Future Age Calculator
                    </h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                        <div>
                            <label
                                style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">From
                                BOD </label>
                            <input type="date" id="birthDateInput"
                                style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.6rem; color: white;">
                        </div>
                        <div>
                            <label
                                style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">To
                                Date</label>
                            <input type="date" id="targetDateInput"
                                style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.6rem; color: white;">
                        </div>
                    </div>
                    <div id="futureAgeDisplay" class="age-display"
                        style="display:none; margin-top: 0.8rem; background: rgba(56, 189, 248, 0.1); padding: 0.8rem; border-radius: 8px; border: 1px solid var(--primary-color);">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">On this date, you will be:</span>
                        <div id="ageResult" style="font-size: 1.1rem; font-weight: 700; color: var(--primary-color);">
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Designed by Artheesh.E</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
